[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-pathfinder-api"
version = "0.1.0"
description = "Career PathFinder API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.111.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "alembic>=1.13.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "instructor>=1.3.3",
    "anthropic>=0.28.0",
    "openai>=1.30.0",
    "networkx>=3.3",
    "sentence-transformers>=3.0.1",
    "uvicorn>=0.30.1",
    "neo4j>=5.18.0",
    "beautifulsoup4>=4.12.0",
    "aiosqlite>=0.20.0",
    "PyJWT>=2.8.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

